name: golangci-lint

on:
    push:
        branches:
            - master
            - main

    pull_request:

permissions:
    contents: read
    pull-requests: read
    checks: write

jobs:
    golangci:
        name: lint
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-go@v5
                with:
                    go-version: '>=1.25'
                    cache: false
            -   name: golangci-lint
                uses: golangci/golangci-lint-action@v7
                with:
                    args: --timeout=30m --issues-exit-code=0
                    install-mode: "goinstall"
